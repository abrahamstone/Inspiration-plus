<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inspiration Plus — Citations motivantes</title>
<style>
  :root {
    --bg: #f6f3ee;
    --bg-2: #ffffff;
    --text: #23201b;
    --text-soft: #6b655c;
    --accent: #d9622b;
    --accent-2: #2b6e64;
    --card-shadow: rgba(35, 32, 27, 0.12);
    --border: #e6e0d6;
    --chip-bg: #ece6da;
    --chip-active-bg: #23201b;
    --chip-active-text: #f6f3ee;
    --heart-off: #c9c2b4;
    --heart-on: #d9622b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191712;
      --bg-2: #232019;
      --text: #f1ede4;
      --text-soft: #a89f8f;
      --accent: #e8823f;
      --accent-2: #4fa89a;
      --card-shadow: rgba(0, 0, 0, 0.45);
      --border: #322d24;
      --chip-bg: #2c2820;
      --chip-active-bg: #e8823f;
      --chip-active-text: #191712;
      --heart-off: #4a4438;
      --heart-on: #e8823f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #191712;
    --bg-2: #232019;
    --text: #f1ede4;
    --text-soft: #a89f8f;
    --accent: #e8823f;
    --accent-2: #4fa89a;
    --card-shadow: rgba(0, 0, 0, 0.45);
    --border: #322d24;
    --chip-bg: #2c2820;
    --chip-active-bg: #e8823f;
    --chip-active-text: #191712;
    --heart-off: #4a4438;
    --heart-on: #e8823f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px 60px;
  }

  .app {
    width: 100%;
    max-width: 640px;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  .logo {
    font-size: 1.9rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--accent);
  }

  .tagline {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--text-soft);
    font-size: 0.85rem;
    margin-top: 4px;
  }

  .chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 2px 18px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }

  .chip {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    flex: 0 0 auto;
    padding: 7px 16px;
    border-radius: 999px;
    background: var(--chip-bg);
    color: var(--text);
    font-size: 0.82rem;
    border: none;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s, transform 0.1s;
  }
  .chip:active { transform: scale(0.96); }
  .chip.active {
    background: var(--chip-active-bg);
    color: var(--chip-active-text);
  }

  .card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 40px 28px;
    box-shadow: 0 10px 30px var(--card-shadow);
    min-height: 220px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    transition: opacity 0.2s ease;
  }

  .quote-mark {
    font-size: 2.6rem;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 6px;
    font-weight: 700;
  }

  .quote-text {
    font-size: 1.35rem;
    line-height: 1.5;
    margin: 0 0 18px;
  }

  .quote-author {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--text-soft);
    font-size: 0.9rem;
    font-style: normal;
  }

  .quote-category {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: inline-block;
    margin-top: 14px;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent-2);
  }

  .heart-btn {
    position: absolute;
    top: 18px;
    right: 18px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.4rem;
    color: var(--heart-off);
    transition: transform 0.15s, color 0.15s;
    line-height: 1;
  }
  .heart-btn.active { color: var(--heart-on); }
  .heart-btn:active { transform: scale(1.25); }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  .btn {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.15s;
  }
  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: var(--accent);
    color: #fff8f1;
  }

  .btn-secondary {
    background: var(--chip-bg);
    color: var(--text);
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 0.85rem;
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .favorites-section {
    margin-top: 36px;
  }

  .favorites-title {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-soft);
    margin-bottom: 10px;
  }

  .fav-item {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 8px;
    font-size: 0.95rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .fav-text { flex: 1; }
  .fav-author {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--text-soft);
    font-size: 0.78rem;
    margin-top: 4px;
  }
  .fav-remove {
    background: none;
    border: none;
    color: var(--text-soft);
    font-size: 1rem;
    cursor: pointer;
    flex: 0 0 auto;
  }

  .empty-fav {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--text-soft);
    font-size: 0.85rem;
    text-align: center;
    padding: 12px 0;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">✦ Inspiration Plus</div>
    <div class="tagline">Ta dose quotidienne de motivation</div>
  </header>

  <div class="chips" id="chips"></div>

  <div class="card" id="card">
    <button class="heart-btn" id="heartBtn" aria-label="Ajouter aux favoris">♡</button>
    <div class="quote-mark">"</div>
    <p class="quote-text" id="quoteText"></p>
    <div class="quote-author" id="quoteAuthor"></div>
    <div class="quote-category" id="quoteCategory"></div>
  </div>

  <div class="actions">
    <button class="btn btn-secondary" id="copyBtn">Copier</button>
    <button class="btn btn-primary" id="newBtn">Nouvelle citation</button>
  </div>

  <div class="favorites-section">
    <div class="favorites-title">Mes favoris</div>
    <div id="favList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const QUOTES = [
  { t: "La discipline est le pont entre les objectifs et les résultats.", a: "Jim Rohn", c: "Persévérance" },
  { t: "Ce n'est pas parce que les choses sont difficiles que nous n'osons pas, c'est parce que nous n'osons pas qu'elles sont difficiles.", a: "Sénèque", c: "Confiance" },
  { t: "Le succès, c'est tomber sept fois et se relever huit.", a: "Proverbe japonais", c: "Persévérance" },
  { t: "Fais de ta vie un rêve, et d'un rêve, une réalité.", a: "Antoine de Saint-Exupéry", c: "Motivation" },
  { t: "On ne voit bien qu'avec le cœur. L'essentiel est invisible pour les yeux.", a: "Antoine de Saint-Exupéry", c: "Bien-être" },
  { t: "Le seul véritable échec est celui de ne pas essayer.", a: "George Couros", c: "Motivation" },
  { t: "Crois en toi et tu seras invincible.", a: "Anonyme", c: "Confiance" },
  { t: "Un pas à la fois suffit pour gravir une montagne.", a: "Anonyme", c: "Persévérance" },
  { t: "Le meilleur moment pour commencer, c'était hier. Le deuxième meilleur, c'est maintenant.", a: "Proverbe chinois", c: "Motivation" },
  { t: "Ta seule limite, c'est toi.", a: "Anonyme", c: "Confiance" },
  { t: "Le repos fait partie du travail.", a: "Anonyme", c: "Bien-être" },
  { t: "Chaque expert a d'abord été un débutant.", a: "Helen Hayes", c: "Persévérance" },
  { t: "Le succès n'est pas final, l'échec n'est pas fatal.", a: "Winston Churchill", c: "Succès" },
  { t: "Agis comme s'il était impossible d'échouer.", a: "Dorothea Brande", c: "Confiance" },
  { t: "La vie commence à la fin de ta zone de confort.", a: "Neale Donald Walsch", c: "Motivation" },
  { t: "Prends soin de ton corps, c'est le seul endroit où tu es obligé de vivre.", a: "Jim Rohn", c: "Bien-être" },
  { t: "Le succès, c'est faire ce qu'on aime et croire en ce qu'on fait.", a: "Albert Schweitzer", c: "Succès" },
  { t: "Il n'y a pas d'ascenseur vers le succès, il faut prendre l'escalier.", a: "Zig Ziglar", c: "Persévérance" },
  { t: "Doute de tout, découvre-toi.", a: "Cathy Le Fol", c: "Confiance" },
  { t: "Tout ce que tu peux imaginer est réel.", a: "Pablo Picasso", c: "Motivation" },
  { t: "La respiration est le pont qui relie la vie à la conscience.", a: "Thich Nhat Hanh", c: "Bien-être" },
  { t: "Ne compte pas les jours, fais que les jours comptent.", a: "Mohammed Ali", c: "Motivation" },
  { t: "La confiance en soi est le premier secret du succès.", a: "Ralph Waldo Emerson", c: "Confiance" },
  { t: "Le plus grand risque est de ne prendre aucun risque.", a: "Mark Zuckerberg", c: "Succès" },
  { t: "Tomber, ce n'est pas échouer. Échouer, c'est rester là où on est tombé.", a: "Socrate", c: "Persévérance" },
  { t: "Sois toi-même, tous les autres sont déjà pris.", a: "Oscar Wilde", c: "Confiance" },
  { t: "La paix vient de l'intérieur. Ne la cherche pas ailleurs.", a: "Bouddha", c: "Bien-être" },
  { t: "Le futur appartient à ceux qui croient en la beauté de leurs rêves.", a: "Eleanor Roosevelt", c: "Motivation" },
  { t: "On n'échoue vraiment que lorsqu'on cesse d'essayer.", a: "Elbert Hubbard", c: "Persévérance" },
  { t: "La réussite est la somme de petits efforts répétés jour après jour.", a: "Robert Collier", c: "Succès" }
];

const CATEGORIES = ["Toutes", "Motivation", "Confiance", "Persévérance", "Succès", "Bien-être"];

let currentCategory = "Toutes";
let currentQuote = null;

const chipsEl = document.getElementById('chips');
const quoteTextEl = document.getElementById('quoteText');
const quoteAuthorEl = document.getElementById('quoteAuthor');
const quoteCategoryEl = document.getElementById('quoteCategory');
const heartBtn = document.getElementById('heartBtn');
const favListEl = document.getElementById('favList');
const toastEl = document.getElementById('toast');
const cardEl = document.getElementById('card');

function loadFavorites() {
  try {
    const raw = localStorage.getItem('etincelle_favs');
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}

function saveFavorites(favs) {
  try { localStorage.setItem('etincelle_favs', JSON.stringify(favs)); } catch (e) {}
}

function isFavorite(q) {
  return loadFavorites().some(f => f.t === q.t);
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1600);
}

function renderChips() {
  chipsEl.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (cat === currentCategory ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = () => {
      currentCategory = cat;
      renderChips();
      pickQuote();
    };
    chipsEl.appendChild(btn);
  });
}

function pool() {
  if (currentCategory === "Toutes") return QUOTES;
  return QUOTES.filter(q => q.c === currentCategory);
}

function pickQuote(avoidRepeat = true) {
  const p = pool();
  if (p.length === 0) return;
  let q;
  do {
    q = p[Math.floor(Math.random() * p.length)];
  } while (avoidRepeat && p.length > 1 && currentQuote && q.t === currentQuote.t);
  currentQuote = q;
  renderQuote();
}

function renderQuote() {
  cardEl.style.opacity = '0';
  setTimeout(() => {
    quoteTextEl.textContent = currentQuote.t;
    quoteAuthorEl.textContent = "— " + currentQuote.a;
    quoteCategoryEl.textContent = currentQuote.c;
    heartBtn.textContent = isFavorite(currentQuote) ? '♥' : '♡';
    heartBtn.classList.toggle('active', isFavorite(currentQuote));
    cardEl.style.opacity = '1';
  }, 120);
}

function renderFavorites() {
  const favs = loadFavorites();
  favListEl.innerHTML = '';
  if (favs.length === 0) {
    favListEl.innerHTML = '<div class="empty-fav">Aucun favori pour l\\'instant — appuie sur le cœur d\\'une citation qui te plaît.</div>';
    return;
  }
  favs.slice().reverse().forEach(f => {
    const item = document.createElement('div');
    item.className = 'fav-item';
    item.innerHTML = `<div class="fav-text">${escapeHtml(f.t)}<div class="fav-author">— ${escapeHtml(f.a)}</div></div>`;
    const rm = document.createElement('button');
    rm.className = 'fav-remove';
    rm.textContent = '✕';
    rm.onclick = () => {
      const updated = loadFavorites().filter(x => x.t !== f.t);
      saveFavorites(updated);
      renderFavorites();
      if (currentQuote && currentQuote.t === f.t) renderQuote();
    };
    item.appendChild(rm);
    favListEl.appendChild(item);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

heartBtn.onclick = () => {
  if (!currentQuote) return;
  let favs = loadFavorites();
  if (isFavorite(currentQuote)) {
    favs = favs.filter(f => f.t !== currentQuote.t);
    showToast('Retiré des favoris');
  } else {
    favs.push(currentQuote);
    showToast('Ajouté aux favoris');
  }
  saveFavorites(favs);
  renderQuote();
  renderFavorites();
};

document.getElementById('newBtn').onclick = () => pickQuote();

document.getElementById('copyBtn').onclick = async () => {
  if (!currentQuote) return;
  const text = `"${currentQuote.t}" — ${currentQuote.a}`;
  try {
    await navigator.clipboard.writeText(text);
    showToast('Copié !');
  } catch (e) {
    showToast('Impossible de copier');
  }
};

renderChips();
pickQuote(false);
renderFavorites();
</script>
</body>
</html>
